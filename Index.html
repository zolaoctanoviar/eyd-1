<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Latihan Bahasa Indonesia: Huruf Kapital & Kata Baku</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Roboto', 'Inter', 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #e0eafc 0%, #cfdef3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .quiz-container {
            max-width: 880px;
            width: 100%;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }

        .quiz-header {
            background: #1e2a3e;
            padding: 1.2rem 2rem;
            color: white;
        }

        .quiz-header h1 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            background: #0f1720;
            padding: 8px 16px;
            border-radius: 60px;
            width: fit-content;
            gap: 20px;
            font-size: 0.85rem;
        }

        .stats span {
            font-weight: bold;
            color: #facc15;
        }

        .quiz-body {
            padding: 2rem;
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 1.5rem;
            color: #0f172a;
            border-left: 5px solid #3b82f6;
            padding-left: 1rem;
        }

        .analogy-highlight {
            background: #f1f5f9;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            font-family: monospace;
            font-weight: 700;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin: 1.2rem 0 1rem;
        }

        .option-btn {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 60px;
            padding: 0.85rem 1.2rem;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-btn:hover:not(:disabled) {
            background: #f8fafc;
            border-color: #94a3b8;
            transform: scale(0.99);
        }

        .option-prefix {
            font-weight: 800;
            background: #f1f5f9;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 60px;
        }

        .option-btn.selected {
            background: #dbeafe;
            border-color: #3b82f6;
        }

        .feedback-message {
            margin-top: 1rem;
            padding: 0.7rem 1.2rem;
            border-radius: 40px;
            font-size: 0.9rem;
            background: #f1f5f9;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin: 24px 0 16px;
        }

        button {
            background: #334155;
            border: none;
            padding: 10px 18px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            color: white;
            cursor: pointer;
            transition: 0.15s;
            flex: 1;
        }

        .next-btn {
            background: #2563eb;
        }

        .submit-all-btn {
            background: #16a34a;
            box-shadow: 0 2px 6px rgba(22,163,74,0.3);
        }

        .reset-btn {
            background: #475569;
        }

        .result-area {
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 2px dashed #cbd5e1;
            text-align: center;
            font-weight: bold;
        }

        .summary-panel {
            background: #f8fafc;
            border-radius: 1.5rem;
            padding: 1rem 1.2rem;
            margin-top: 1rem;
            border: 1px solid #e2e8f0;
        }

        .answer-review-item {
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.85rem;
        }

        .answer-review-item.correct-review {
            background: #f0fdf4;
            margin: 4px 0;
            border-radius: 14px;
            padding: 8px 12px;
            border-left: 4px solid #22c55e;
        }

        .answer-review-item.wrong-review {
            background: #fef2f2;
            margin: 4px 0;
            border-radius: 14px;
            padding: 8px 12px;
            border-left: 4px solid #ef4444;
        }

        .score-big {
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
            margin: 15px 0;
            background: linear-gradient(135deg, #1e293b, #2d3e50);
            -webkit-background-clip: text;
            background-clip: text;
            color: #0f172a;
        }

        .back-btn {
            background: #3b82f6;
            margin-top: 12px;
        }

        @media (max-width: 550px) {
            .quiz-body { padding: 1.2rem; }
            .question-text { font-size: 1.2rem; }
        }
    </style>
    <script src="https://sql.js.org/dist/sql-wasm.js"></script>
</head>
<body>
<div class="quiz-container" id="quizRoot">
    <div class="quiz-header">
        <h1>📖 EYD & Kata Baku Indonesia - Latihan 1</h1>
        <div class="stats">
            <div>📋 Soal: <span id="currentIdxDisplay">0</span> / <span id="totalCountSpan">0</span></div>
            <div>✅ Skor: <span id="scoreDisplay">0</span></div>
        </div>
    </div>
    <div class="quiz-body" id="dynamicContent">
        <div style="text-align:center; padding: 2rem;">Memuat database soal...</div>
    </div>
</div>

<script>
    // ==============================================================
    // 20 SOAL BAHASA INDONESIA: HURUF KAPITAL & KATA BAKU
    // ==============================================================
    const rawQuestions = [
        { stem: "Penulisan yang benar menurut EYD untuk kata '_____' adalah 'APOTEK'. Sedangkan kata baku dari 'ijin' adalah '_____'", options: ["apotik — izin", "Apotek — ijin", "apotek — izin", "Apotik — izin", "Apotek — idzin"], correct: 2 },
        { stem: "Kalimat berikut yang menggunakan huruf kapital dengan benar adalah _____, sebagaimana 'Saya suka membaca buku' menggunakan kapital pada awal kalimat.", options: ["Dia tinggal di Jalan Merpati Nomor 10", "Dia tinggal di jalan merpati nomor 10", "dia tinggal di Jalan Merpati No. 10", "Dia tinggal di jalan Merpati nomor 10", "Dia Tinggal di Jalan Merpati nomor 10"], correct: 0 },
        { stem: "Kata baku dari 'praktek' adalah '_____', sedangkan bentuk tidak baku 'resiko' seharusnya ditulis '_____'", options: ["praktik — risiko", "praktekk — resiko", "praktik — resiko", "praktek — risiko", "praktik — risico"], correct: 0 },
        { stem: "Penulisan gelar akademik yang benar: 'Rina S.Pd.' menggunakan _____ , sama seperti penulisan _____ yang juga menggunakan kapital di awal unsur gelar.", options: ["huruf kapital pada setiap huruf — doktor", "huruf kapital di awal singkatan — Doktor Andi", "huruf kapital semua — Profesor", "huruf kecil semua — sarjana", "huruf kapital pada S dan P — Magister"], correct: 1 },
        { stem: "Kata baku dari 'nasehat' adalah '_____' , sedangkan bentuk baku '_____' menggantikan kata tidak baku 'rubah' (ubah).", options: ["nasihah — ganti", "nasihat — ubah", "nasehat — merubah", "nasihat — rubah", "nasehat — berubah"], correct: 1 },
        { stem: "Menurut PUEBI, penulisan judul 'Pengaruh Pendidikan Karakter terhadap Perilaku Siswa' sudah tepat karena _____. Hal ini berbeda dengan penulisan '_____' yang salah kapital.", options: ["setiap kata diawali kapital kecuali kata tugas — dan Perilaku remaja Modern", "hanya kata pertama yang kapital — Membangun Generasi Unggul", "semua huruf kapital — Cara Belajar Efektif", "kata kerja dan benda dikapital — di Era Digital", "kata depan selalu kapital — Untuk Negeri"], correct: 0 },
        { stem: "Kata baku untuk menyebut 'orang yang bertugas menjaga keamanan kampung' adalah '_____', sedangkan bentuk tidak baku 'kampung' yang benar adalah '_____'", options: ["satpam — kampong", "polisi — kampung", "Hansip — kampong", "keamanan — komplek", "satuan pengamanan — kampung"], correct: 0 },
        { stem: "Kalimat 'Dia lahir di Bandung, 17 Agustus 1945' sudah sesuai kaidah karena _____. Sementara itu, penulisan nama bulan 'agustus' seharusnya menggunakan _____.", options: ["huruf awal nama kota dan bulan pakai kapital — huruf kapital A", "koma sebelum tahun — huruf kecil", "angka 17 tanpa kapital — angka Romawi", "tahun ditulis lengkap — kapital semua", "nama kota diawali kapital — huruf tegak"], correct: 0 },
        { stem: "Kata baku dari 'ijazah' sudah benar, manakah bentuk baku dari 'karir'? _____, sebagaimana 'sistim' yang baku adalah '_____'", options: ["karier — sistem", "karir — sistim", "karier — sistim", "karir — sistem", "karier — sistematis"], correct: 0 },
        { stem: "Penulisan singkatan nama lembaga yang benar: 'UNESCO' (huruf kapital semua). Contoh lainnya, '_____' untuk Perserikatan Bangsa-Bangsa, dan '_____' untuk Ikatan Dokter Indonesia.", options: ["PBB — IDI", "Pbb — Idi", "pbb — idi", "P.B.B — I.D.I", "Perserikatan Bangsa-Bangsa — I.D.I"], correct: 0 },
        { stem: "Kata tidak baku 'merubah' (mengganti) memiliki bentuk baku '_____', sedangkan kata baku '_____' berarti membuat menjadi lain.", options: ["mengubah — merubah", "merubah — mengubah", "merubah — rubah", "mengubah — mengubah", "rubah — mengubah"], correct: 0 },
        { stem: "Huruf kapital yang tepat untuk penulisan '_____ presiden soekarno' adalah 'Presiden Soekarno', seperti '_____ jenderal sudirman' yang benar 'Jenderal Sudirman'.", options: ["presiden — jenderal", "Presiden — Jenderal", "PRESIDEN — JENDERAL", "Presiden — jenderal", "presiden — Jenderal"], correct: 1 },
        { stem: "Kata baku dari 'ijazah' sudah tepat; bentuk baku kata 'aktifitas' adalah _____, dan 'kwalitas' adalah '_____'", options: ["aktivitas — kualitas", "aktifitas — kualitas", "aktivitas — kwalitas", "aktifitas — kwalitas", "aktivitas — kualitas"], correct: 0 },
        { stem: "Penulisan nama geografi yang benar: 'Sungai Ciliwung' menggunakan kapital pada awal kata, sebagaimana '_____' juga tepat.", options: ["Danau Toba", "danau toba", "gunung merapi", "sungai Musi", "kepulauan Seribu"], correct: 0 },
        { stem: "Kata baku dari 'resleting' adalah _____. Bentuk baku yang setara untuk 'tehnik' adalah _____.", options: ["risleting — teknik", "resleting — tekhnik", "risleting — tekhnik", "resleting — teknik", "resliting — tekhnik"], correct: 3 },
        { stem: "Kalimat baku: 'Kami sudah ________ selama tiga jam di ruang tunggu.' Pilih kata baku yang tepat. Analogi dengan 'Dia ________ cerita lucu' menggunakan kata 'mengarang'.", options: ["menunggu — mengarang", "nunggu — ngarang", "menanti — mengarang", "tunggu — mengarang", "menunggu — mengarang"], correct: 4 },
        { stem: "Penulisan kata depan yang benar: '________' (di + Cirebon) ditulis terpisah, berbeda dengan kata 'menjadi satu' yang ditulis _____.", options: ["di Cirebon — menjadi", "dicirebon — menjadi", "di Cirebon — menjadi", "diCirebon — menjadi", "di cirebon — menjadi"], correct: 0 },
        { stem: "Kata baku untuk 'cendekiawan' sudah sesuai; bentuk baku dari 'konggres' adalah _____, dan 'proyek' bentuk bakunya adalah _____.", options: ["kongres — proyek", "konggres — proyek", "kongres — proyek", "konggres — proyek", "kongres — proyek"], correct: 2 },
        { stem: "Penulisan huruf kapital pada unsur nama agama: 'Islam', 'Kristen', dan '_____' (Hindu) harus diawali huruf kapital. Begitu juga kata 'Al-Qur'an' menggunakan kapital pada huruf _____.", options: ["hindu — A", "Hindu — A", "Hindu — q", "hindu — Q", "Hindu — Awal"], correct: 1 },
        { stem: "Kata tidak baku 'syarat' yang benar adalah 'syarat' (sudah baku). Manakah bentuk baku dari 'analisa'? _____, dan '_____' adalah bentuk baku dari 'jadual'.", options: ["analisis — jadwal", "analisa — jadwal", "analisis — jadual", "analisa — jadual", "analisa — jadwal"], correct: 0 }
    ];

    // ==============================================================
    // STATE
    // ==============================================================
    let db = null;
    let currentQuestionIndex = 0;
    let userAnswers = new Array(rawQuestions.length).fill(null);
    let totalQuestions = rawQuestions.length;
    let showSummaryMode = false;

    const dynamicDiv = document.getElementById('dynamicContent');
    const currentIdxSpan = document.getElementById('currentIdxDisplay');
    const totalCountSpan = document.getElementById('totalCountSpan');
    const scoreSpan = document.getElementById('scoreDisplay');

    function computeScore() {
        let score = 0;
        for (let i = 0; i < userAnswers.length; i++) {
            if (userAnswers[i] !== null && userAnswers[i] === rawQuestions[i].correct) score++;
        }
        return score;
    }

    function updateStatsUI() {
        currentIdxSpan.innerText = currentQuestionIndex + 1;
        totalCountSpan.innerText = totalQuestions;
        scoreSpan.innerText = computeScore();
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function formatStemWithBlanks(stem) {
        return stem.replace(/_____/g, '<span class="analogy-highlight">______</span>')
                   .replace(/…/g, '<span class="analogy-highlight">...</span>');
    }

    // TAMPILKAN SEMUA JAWABAN + SKOR AKHIR
    function renderFullSummary() {
        const finalScore = computeScore();
        const answeredCount = userAnswers.filter(a => a !== null).length;
        let summaryHtml = `
            <div class="score-big">🎯 SKOR AKHIR: ${finalScore} / ${totalQuestions}</div>
            <div style="text-align:center; margin-bottom:16px;">📊 Soal terjawab: ${answeredCount} dari ${totalQuestions}</div>
            <div class="summary-panel">
                <div style="font-weight:bold; margin-bottom:12px;">📋 DAFTAR JAWABAN & PEMBAHASAN (EYD & Kata Baku):</div>
                <div id="answerReviewList" style="max-height: 450px; overflow-y: auto; padding-right: 6px;">
        `;
        for (let i = 0; i < rawQuestions.length; i++) {
            const q = rawQuestions[i];
            const userChoiceIdx = userAnswers[i];
            const isCorrect = (userChoiceIdx !== null && userChoiceIdx === q.correct);
            const userText = (userChoiceIdx !== null) ? q.options[userChoiceIdx] : "(Tidak dijawab)";
            const correctText = q.options[q.correct];
            const statusIcon = isCorrect ? "✅" : (userChoiceIdx !== null ? "❌" : "⚠️");
            let statusClass = (isCorrect ? "correct-review" : (userChoiceIdx !== null ? "wrong-review" : ""));
            summaryHtml += `
                <div class="answer-review-item ${statusClass}" style="margin-bottom: 10px;">
                    <div style="font-weight:600;">${i+1}. ${escapeHtml(q.stem)}</div>
                    <div style="font-size:0.85rem; margin-top:5px;">${statusIcon} <strong>Jawaban Anda:</strong> ${escapeHtml(userText)}</div>
                    <div style="font-size:0.85rem;"><strong>✔️ Jawaban benar:</strong> ${escapeHtml(correctText)}</div>
                    ${!isCorrect && userChoiceIdx !== null ? '<span style="font-size:0.75rem; color:#b91c1c;">✏️ Perhatikan kaidah huruf kapital atau pilihan kata baku.</span>' : ''}
                    ${userChoiceIdx === null ? '<span style="font-size:0.75rem; color:#92400e;">⚠️ Tidak dijawab (anggap salah).</span>' : ''}
                </div>
            `;
        }
        summaryHtml += `
                </div>
                <button id="backToQuizBtn" class="back-btn" style="margin-top: 20px; width:100%;">⟳ Kembali ke Mode Kuis (Reset Jawaban)</button>
            </div>
        `;
        dynamicDiv.innerHTML = summaryHtml;
        const backBtn = document.getElementById('backToQuizBtn');
        if (backBtn) {
            backBtn.addEventListener('click', () => {
                if (confirm('Reset semua jawaban dan kembali ke mode latihan per soal?')) {
                    userAnswers.fill(null);
                    currentQuestionIndex = 0;
                    showSummaryMode = false;
                    updateStatsUI();
                    renderCurrentQuestionFromDB();
                }
            });
        }
    }

    // RENDER SATU SOAL
    function renderCurrentQuestionFromDB() {
        if (showSummaryMode) {
            renderFullSummary();
            return;
        }
        if (!db) return;
        const stmt = db.prepare("SELECT stem, opt_a, opt_b, opt_c, opt_d, opt_e, correct_idx FROM questions WHERE id = ?");
        stmt.bind([currentQuestionIndex + 1]);
        if (stmt.step()) {
            const row = stmt.getAsObject();
            const currentQ = {
                stem: row.stem,
                options: [row.opt_a, row.opt_b, row.opt_c, row.opt_d, row.opt_e],
                correct: row.correct_idx
            };
            renderSingleQuestionUI(currentQ);
        } else {
            dynamicDiv.innerHTML = "<div>Error memuat soal</div>";
        }
        stmt.free();
    }

    function renderSingleQuestionUI(q) {
        const currentAnswer = userAnswers[currentQuestionIndex];
        const isLocked = (currentAnswer !== null);
        const optionLetters = ['A', 'B', 'C', 'D', 'E'];
        let optionsHtml = '';
        for (let i = 0; i < q.options.length; i++) {
            let additionalClass = '';
            if (isLocked) {
                if (i === q.correct) additionalClass = 'correct-feedback';
                if (i === currentAnswer && i !== q.correct) additionalClass = 'wrong-feedback';
                if (i === currentAnswer) additionalClass += ' selected';
            } else {
                if (i === currentAnswer) additionalClass = 'selected';
            }
            optionsHtml += `
                <div class="option-btn ${additionalClass}" data-opt-index="${i}">
                    <span class="option-prefix">${optionLetters[i]}</span>
                    <span>${escapeHtml(q.options[i])}</span>
                </div>
            `;
        }

        let feedbackMsg = '';
        if (isLocked) {
            const isCorrect = (currentAnswer === q.correct);
            if (isCorrect) {
                feedbackMsg = `✅ Benar! Pilihan tepat sesuai kaidah bahasa Indonesia baku.`;
            } else {
                feedbackMsg = `❌ Kurang tepat. Jawaban benar: ${escapeHtml(q.options[q.correct])}. Pilihan Anda: ${escapeHtml(q.options[currentAnswer])}. Pelajari kembali aturan kapital/kata baku.`;
            }
        } else {
            feedbackMsg = `💡 Pilih opsi yang paling tepat sesuai EYD dan Pedoman Kata Baku. Setelah menjawab, klik "SUBMIT & LIHAT SEMUA JAWABAN" untuk mengetahui skor akhir.`;
        }

        const answeredCount = userAnswers.filter(a => a !== null).length;
        const allAnswered = (answeredCount === totalQuestions);
        
        const html = `
            <div class="question-text">
                ${formatStemWithBlanks(q.stem)}
            </div>
            <div class="options-grid" id="optionsGrid">
                ${optionsHtml}
            </div>
            <div class="feedback-message">
                ${feedbackMsg}
            </div>
            <div class="nav-buttons">
                <button id="prevBtn" ${currentQuestionIndex === 0 ? 'disabled' : ''}>◀ Sebelumnya</button>
                <button id="resetBtn" class="reset-btn">⟳ Reset Semua Jawaban</button>
                <button id="nextBtn" ${currentQuestionIndex === totalQuestions-1 ? '' : ''}>Berikutnya ▶</button>
            </div>
            <div class="result-area">
                📊 Progres: ${answeredCount}/${totalQuestions} soal terjawab | ✅ Skor sementara: ${computeScore()}
                ${allAnswered ? '<span style="color:#16a34a; margin-left:10px;">✔️ Lengkap! Klik submit untuk hasil final.</span>' : ''}
            </div>
            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button id="submitAllBtn" class="submit-all-btn">📬 SUBMIT & LIHAT SEMUA JAWABAN + SKOR AKHIR</button>
            </div>
        `;
        dynamicDiv.innerHTML = html;
        
        if (!isLocked) {
            const optButtons = document.querySelectorAll('.option-btn');
            optButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (userAnswers[currentQuestionIndex] !== null) return;
                    const selectedIdx = parseInt(btn.dataset.optIndex);
                    userAnswers[currentQuestionIndex] = selectedIdx;
                    updateStatsUI();
                    renderCurrentQuestionFromDB();
                });
            });
        }
        
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const resetBtn = document.getElementById('resetBtn');
        const submitBtn = document.getElementById('submitAllBtn');
        
        if (prevBtn) {
            prevBtn.addEventListener('click', () => {
                if (currentQuestionIndex > 0) {
                    currentQuestionIndex--;
                    renderCurrentQuestionFromDB();
                    updateStatsUI();
                }
            });
        }
        if (nextBtn) {
            nextBtn.addEventListener('click', () => {
                if (currentQuestionIndex < totalQuestions - 1) {
                    currentQuestionIndex++;
                    renderCurrentQuestionFromDB();
                    updateStatsUI();
                } else {
                    if (userAnswers[currentQuestionIndex] === null) {
                        alert("Silakan jawab soal terakhir terlebih dahulu, atau gunakan tombol SUBMIT untuk melihat hasil akhir.");
                    }
                }
            });
        }
        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                if (confirm('⚠️ Reset semua jawaban? Seluruh progres akan hilang.')) {
                    userAnswers.fill(null);
                    updateStatsUI();
                    renderCurrentQuestionFromDB();
                }
            });
        }
        if (submitBtn) {
            submitBtn.addEventListener('click', () => {
                const answered = userAnswers.filter(a => a !== null).length;
                if (answered < totalQuestions) {
                    if (!confirm(`Anda baru menjawab ${answered} dari ${totalQuestions} soal. Soal yang tidak dijawab akan dianggap salah. Tetap ingin melihat hasil akhir?`)) {
                        return;
                    }
                }
                showSummaryMode = true;
                renderFullSummary();
            });
        }
    }

    // INISIALISASI SQLite DENGAN DATA BARU
    function initSQLiteAndRun() {
        window.initSqlJs({ locateFile: filename => `https://sql.js.org/dist/${filename}` })
            .then(SQL => {
                db = new SQL.Database();
                db.run(`CREATE TABLE questions (
                    id INTEGER PRIMARY KEY,
                    stem TEXT,
                    opt_a TEXT,
                    opt_b TEXT,
                    opt_c TEXT,
                    opt_d TEXT,
                    opt_e TEXT,
                    correct_idx INTEGER
                )`);
                const insert = db.prepare(`INSERT INTO questions VALUES (?,?,?,?,?,?,?,?)`);
                for (let i = 0; i < rawQuestions.length; i++) {
                    const q = rawQuestions[i];
                    insert.run([i+1, q.stem, q.options[0], q.options[1], q.options[2], q.options[3], q.options[4], q.correct]);
                }
                insert.free();
                updateStatsUI();
                renderCurrentQuestionFromDB();
            })
            .catch(err => {
                dynamicDiv.innerHTML = `<div style="color:red;">Gagal memuat database: ${err.message}</div>`;
            });
    }

    initSQLiteAndRun();
</script>
</body>
</html>
